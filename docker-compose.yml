services:
  app:
    build:
      context: .
      target: dev
    image: aula05-rede-social:dev
    container_name: aula05-rede-social

    env_file:
      - path: .env
        required: false

    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: file:/app/dev.db
      SESSION_SECRET: ${SESSION_SECRET:-aula05-segredo-de-desenvolvimento}
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-true}"
      CHOKIDAR_INTERVAL: "${CHOKIDAR_INTERVAL:-300}"

    ports:
      - "3003:3003"

    volumes:
      - .:/app
      - /app/node_modules

    stdin_open: true
    tty: true
